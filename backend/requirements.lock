# Reproduzierbarer Laufzeit-Lockfile fuer das Backend (O-001).
#
# Enthaelt die vollstaendige, gepinnte Laufzeit-Dependency-Closure (Top-Level-Deps
# aus pyproject.toml [project].dependencies inkl. uvicorn[standard], plus alle
# transitiven Abhaengigkeiten). Dev-Deps (pytest, httpx) sind bewusst NICHT
# enthalten — der Docker-Build braucht sie nicht.
#
# Neu erzeugen nach einem Dependency-Update:
#   1. Floors in pyproject.toml anpassen
#   2. python -m venv .venv && .venv/bin/pip install .
#   3. Runtime-Closure einfrieren (siehe deploy/README.md, Abschnitt
#      "Reproduzierbarer Backend-Build") und diese Datei ersetzen.
#
# Der Dockerfile-Runtime-Build installiert exakt diese Versionen
# (pip install -r requirements.lock), danach nur noch die App selbst (--no-deps).

