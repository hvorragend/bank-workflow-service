# Alembic-Konfiguration. Die DB-URL wird in alembic/env.py aus der
# Umgebungsvariablen DATABASE_URL geladen, sodass die gleiche Konfiguration
# fuer Entwicklung (lokal/Postgres-Docker) und Produktion gilt.

[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40

# Format der generierten Migrations-Dateinamen
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url wird in env.py gesetzt — hier nur als Fallback, wird ueberschrieben.
sqlalchemy.url = sqlite:///./bank_workflow.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
