# Alembic-Konfiguration. Die DB-URL wird in alembic/env.py aus der
# Umgebungsvariablen DATABASE_URL geladen, sodass die gleiche Konfiguration
# fuer Entwicklung (lokal) und Produktion (Container) gilt.
#
# WICHTIG (S-013): env.py bevorzugt IMMER DATABASE_URL. Die sqlalchemy.url
# unten ist NUR ein Fallback, wenn DATABASE_URL nicht gesetzt ist. Damit ein
# versehentlicher Aufruf aus dem falschen Verzeichnis (ohne gesetztes
# DATABASE_URL) nicht stillschweigend eine FRISCHE, leere DB im aktuellen
# Arbeitsverzeichnis migriert, zeigt der Fallback bewusst auf eine deutlich
# benannte Sackgassen-Datei statt auf die produktive bank_workflow.db.
# In Produktion IMMER via Container-CMD/ENV (DATABASE_URL=sqlite:////app/data/...)
# aufrufen — siehe backend/Dockerfile und deploy/docker-compose.yml.

[alembic]
script_location = alembic
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40

# Format der generierten Migrations-Dateinamen
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url wird in env.py aus DATABASE_URL gesetzt und ueberschrieben.
# Dieser Fallback greift NUR ohne DATABASE_URL und zeigt absichtlich auf eine
# offensichtlich falsche Datei, damit ein Fehlaufruf sofort auffaellt statt
# unbemerkt eine leere Produktions-DB anzulegen.
sqlalchemy.url = sqlite:///./alembic_MISSING_DATABASE_URL.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
