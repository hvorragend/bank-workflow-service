# Nginx-Konfiguration fuer das React-Frontend (Phase 1 / Commit 3).
# Servt statische Files + leitet API-Pfade an den backend-Service durch.

server {
  listen      8080;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # SPA-Fallback: jede unbekannte URL liefert die index.html aus, damit
  # React Router auch tiefere Pfade beim Direktaufruf laden kann.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API-Reverseproxy. Der Backend-Container heisst im docker-compose-Netz "backend".
  location ~ ^/(auth|instances|definitions|health|ready|legacy|docs|openapi.json|redoc) {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Statische Assets dauerhaft cachen (Vite haengt Hash an Dateinamen).
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
