# Nginx-Konfiguration fuer das React-Frontend (Phase 1 / Commit 3).
# Servt statische Files + leitet API-Pfade an den backend-Service durch.

server {
  listen      8080;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # ---- Security-Header (F-027) --------------------------------------------
  # Gelten fuer alle Responses dieses Servers (add_header vererbt sich in
  # location-Bloecke, solange dort kein eigenes add_header steht).
  # CSP: strikt 'self'. Die SPA laedt keine externen Skripte/Fonts/Styles mehr.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  # HSTS nur aktivieren, wenn TLS direkt hier terminiert. Bei externem
  # TLS-Terminator (Reverse Proxy / Ingress) diesen Header dort setzen:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Uploads: Backend erlaubt 25 MB — hier etwas Spielraum fuer Overhead (F-012).
  client_max_body_size 26m;

  # SPA-Fallback: jede unbekannte URL liefert die index.html aus, damit
  # React Router auch tiefere Pfade beim Direktaufruf laden kann.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API-Reverseproxy. Der Backend-Container heisst im docker-compose-Netz "backend".
  # Wenn hier ein Pfad fehlt, faellt der Request stumm in den SPA-Fallback und
  # der API-Client bekommt index.html statt JSON — also bei neuen Backend-
  # Routen IMMER hier ergaenzen.
  #
  # Wichtig: /admin steht hier bewusst NICHT — die Admin-API laeuft im Frontend
  # unter /api/admin/..., weil sich die SPA-Routen unter /admin/... sonst mit
  # gleichnamigen Backend-Endpunkten kreuzen. Beim Browser-Refresh auf
  # /admin/users faellt nginx so sauber auf den SPA-Fallback zurueck.
  location ~ ^/(auth|instances|definitions|reporting|health|ready|docs|openapi.json|redoc) {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Anhang-Uploads bis 25 MB (Backend-Limit) — plus Overhead.
    client_max_body_size 26m;
    # LDAP-Sync und groessere Admin-Operationen brauchen mehr Spielraum.
    proxy_read_timeout   180s;
    proxy_send_timeout   180s;
  }

  # Admin-API unter /api/admin/... — der /api-Prefix wird beim Proxy entfernt,
  # das Backend hoert weiterhin auf /admin/... (so bleiben Backend-Tests stabil).
  location /api/ {
    proxy_pass         http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 26m;
    proxy_read_timeout   180s;
    proxy_send_timeout   180s;
  }

  # Statische Assets dauerhaft cachen (Vite haengt Hash an Dateinamen).
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
